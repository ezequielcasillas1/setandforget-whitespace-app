[package]
name = "ai-overlay"
version = "0.1.0-preview.1"
edition = "2021"
rust-version = "1.85"
resolver = "3"

[lib]
name = "ai_overlay_lib"
path = "src/lib.rs"

[[bin]]
name = "ai-overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }
rand = "0.8"
sysinfo = { version = "0.36.1", default-features = false, features = ["system", "user"] }
tauri-plugin-single-instance = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
